# TarangOS — one command to run everything:
#
#   docker compose up -d
#
# Then open http://localhost:4517 and create your account.

services:
  tarangos:
    build:
      context: .
      dockerfile: Dockerfile
    image: tarangos:latest
    container_name: tarangos
    restart: unless-stopped

    ports:
      # Bind to all interfaces so your phone can reach it on the LAN.
      # To restrict it to this machine only, change to "127.0.0.1:4517:4517".
      - "4517:4517"

    volumes:
      # Your entire dataset — database, backups and generated secrets.
      # Back this folder up and you have backed up everything.
      - ./data:/app/data

    environment:
      NODE_ENV: production
      PORT: "4517"
      HOST: 0.0.0.0
      DATA_DIR: /app/data
      DATABASE_URL: "file:/app/data/tarangos.db"

      # Secrets: leave unset and they are generated once into data/.secrets.json,
      # or set them explicitly in a .env file next to this compose file.
      ENCRYPTION_KEY: "${ENCRYPTION_KEY:-}"
      SESSION_PEPPER: "${SESSION_PEPPER:-}"

      # Session & lock behaviour
      SESSION_IDLE_MINUTES: "${SESSION_IDLE_MINUTES:-720}"
      SESSION_ABSOLUTE_DAYS: "${SESSION_ABSOLUTE_DAYS:-30}"
      AUTO_LOCK_MINUTES: "${AUTO_LOCK_MINUTES:-20}"
      MAX_FAILED_LOGINS: "${MAX_FAILED_LOGINS:-7}"
      LOCKOUT_MINUTES: "${LOCKOUT_MINUTES:-15}"

      # Cookies are Secure by default, which requires HTTPS. Over plain HTTP on
      # your own LAN, set this to true (see the README for the HTTPS option).
      ALLOW_INSECURE_COOKIE: "${ALLOW_INSECURE_COOKIE:-true}"
      TRUST_PROXY: "${TRUST_PROXY:-false}"

      # Backups
      AUTO_BACKUP: "${AUTO_BACKUP:-true}"
      BACKUP_KEEP: "${BACKUP_KEEP:-30}"

    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:4517/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    # Hardening: the app never needs to write outside /app/data.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
